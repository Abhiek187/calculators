coreKtx = "1.19.1"
appcompat = "1.8.0"
material = "1.14.0"
constraintLayout = "2.2.2"
activityKtx = "1.13.0"

junit = "4.13.2"
coreTesting = "2.2.0"

extJunit = "1.3.0"
